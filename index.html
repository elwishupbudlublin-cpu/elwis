<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1A2B">
<title>ELWIS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="top" id="top" hidden>
  <button class="icon" id="btnBack" aria-label="Wstecz" hidden>‹</button>
  <div class="brand"><span class="logobox"><span class="logo">ELWIS</span><span class="ver" id="topVer"></span></span><span class="sub" id="topSub"></span></div>
  <div class="net" id="net"><span class="dot"></span><span id="netText"></span></div>
  <button class="icon" id="btnSync" aria-label="Synchronizuj"><span class="spinico">⟳</span><span class="bn" id="nPend" hidden></span></button>
  <button class="who" id="btnUser" aria-label="Ustawienia i wylogowanie"></button>
</header>
<div class="syncstrip" id="syncStrip" hidden><div class="sbar"><i id="syncFill"></i></div><span id="syncTxt"></span></div>
<div class="memwarn" id="memWarn" role="alert" hidden>⚠ Mało miejsca na tablecie – zgłoś to administratorowi (Łukasz P)</div>
<main id="view"></main>
<nav class="bnav" id="bnav" hidden aria-label="Nawigacja">
  <button id="nPlan"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg>Plan</button>
  <button id="nBud"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21h18M5 21V9l7-5 7 5v12M10 21v-5h4v5"></path></svg>Budowy</button>
  <button id="nDok"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM5 17a3 3 0 0 1 3-3h11"></path></svg>Dokumenty techniczne</button>
</nav>
<div id="modal"></div>
<div id="toast" class="toast" role="status"></div>
<script src="js/db.js"></script>
<script src="js/api.js"></script>
<script src="js/state.js"></script>
<script src="js/plan.js"></script>
<script src="js/prot.js"></script>
<script src="js/app.js"></script>
</body>
</html>
